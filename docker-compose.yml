services:
  billing-service:
    build: { context: ., dockerfile: Dockerfile }
    image: beaconstone/billing-service:local
    container_name: billing-service
    restart: unless-stopped
    ports: ["${HOST_PORT:-3000}:3000"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      SERVICE_NAME: ${SERVICE_NAME:-billing-service}
      API_KEY: ${API_KEY:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    profiles: [proxy]
    image: nginx:1.25-alpine
    container_name: billing-service-proxy
    restart: unless-stopped
    depends_on:
      billing-service: { condition: service_healthy }
    ports: ["${PROXY_PORT:-8080}:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
