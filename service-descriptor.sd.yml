organization: Billing Platform
description: Owns invoices and settlement; authorises invoice payments through Payments.
computeClassification:
  dataType: [None]
links:
  healthcheck:
    uri: /health
  source:
    url: https://github.com/highvelocity-rca-demo/billing-service
compose:
  microservice:
    image: ghcr.io/highvelocity-rca-demo/billing-service
    tag: ${DOCKER_TAG}
    ports: [8080:3000]
buildNumber: ${DOCKER_TAG}
config:
  environmentVariables:
    NODE_ENV: production
    SERVICE_NAME: billing-service
